# CI for process-sim-lab. Actions pinned by commit SHA; gitleaks from its release tarball checked by sha256.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the package
        run: python3 -m pip install --disable-pip-version-check -e .
      - name: Run tests
        run: python3 -m unittest discover -v -s tests -p 'test_*.py'

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          dir="${RUNNER_TEMP}/gitleaks"
          mkdir -p "${dir}"
          curl -fsSL --retry 3 -o "${dir}/${tarball}" "${base}/${tarball}"
          curl -fsSL --retry 3 -o "${dir}/checksums.txt" "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep -qx "${GITLEAKS_SHA256}  ${tarball}" "${dir}/checksums.txt"
          echo "${GITLEAKS_SHA256}  ${dir}/${tarball}" | sha256sum -c -
          tar -xzf "${dir}/${tarball}" -C "${dir}" gitleaks
          echo "${dir}" >> "${GITHUB_PATH}"
      - name: Scan full history
        run: gitleaks git --redact --no-banner -v .

  ci-result:
    name: ci-result
    if: always()
    needs: [tests, gitleaks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job must succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "${NEEDS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if ! echo "${NEEDS}" | jq -e 'length > 0 and all(.[]; .result == "success")' > /dev/null; then
            echo "::error::ci-result fails because at least one job did not succeed"
            exit 1
          fi
